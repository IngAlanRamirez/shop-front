<div class="child-page">
  <h2>Usuarios</h2>

  <div *ngIf="users?.length; else noUsers">
    <table class="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Ventas</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{ u.id }}</td>
          <td>{{ u.name }}</td>
          <td>{{ u.email }}</td>
          <td>
            <span class="badge" [ngClass]="getRoleClass(u.role)">{{
              formatRole(u.role)
            }}</span>
          </td>
          <td>{{ u.salesCount ? u.salesCount : 0 }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noUsers>
    <p>No hay usuarios para mostrar.</p>
  </ng-template>
</div>
