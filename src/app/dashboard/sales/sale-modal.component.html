<div class="modal-backdrop" *ngIf="visible">
  <div class="modal">
    <h3>Nueva Venta</h3>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>User ID</label>
        <input formControlName="userId" type="number" />
      </div>

      <div class="field">
        <label>Fecha</label>
        <input formControlName="date" type="date" />
      </div>

      <div class="field">
        <label>Productos</label>
        <div class="products-list" formArrayName="products">
          <div
            class="product-row"
            *ngFor="let _ of items.controls; let i = index"
            [formGroupName]="i"
          >
            <select formControlName="productId">
              <option [value]="null">-- seleccionar producto --</option>
              <option *ngFor="let p of productsList" [value]="p.id">
                {{ p.name }} (SKU: {{ p.sku }})
              </option>
            </select>
            <input type="number" formControlName="quantity" min="1" />
            <button type="button" class="btn small" (click)="removeItem(i)">
              Eliminar
            </button>
          </div>
        </div>

        <div class="products-actions">
          <button type="button" class="btn" (click)="addItem()">
            Agregar producto
          </button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" (click)="close()">Cancelar</button>
        <button type="submit" class="btn accent" [disabled]="form.invalid">
          Crear
        </button>
      </div>
    </form>
  </div>
</div>
